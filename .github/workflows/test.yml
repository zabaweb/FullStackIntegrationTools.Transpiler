on:
  push:
    branches:
    - '**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Build
      run: dotnet build FullStackIntegrationTools.sln --configuration Release
    - name: Test
      run: dotnet test --configuration Release --no-build